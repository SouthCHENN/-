<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  svg{display:block}
</style>
</head>
<body>
<script>
// 用法: icon.html?variant=legacy|fg&size=192
// legacy: 圆角深色方块整图（传统图标，含底）
// fg:     自适应图标前景层（透明底，图形落在中央安全区）
const q = new URLSearchParams(location.search);
const variant = q.get('variant') || 'legacy';
const size = parseInt(q.get('size') || '192', 10);

// 品牌色（design/README.md Design Tokens）
const BG = '#0A0F1C', CYAN = '#00F0FF', MAGENTA = '#FF2E88', DIM = '#5E7186';

// 路线图母题：三站点连线，中间站 = NOW（品红脉冲），呼应 App 路线示意图
// legacy 视图 0..100；fg 把图形缩进中央安全区（自适应图标外圈会被遮罩裁切）
const art = (s) => `
  <g transform="${s}">
    <!-- 地平网格 -->
    <g stroke="${DIM}" stroke-opacity=".28" stroke-width="1">
      <line x1="8" y1="72" x2="92" y2="72"/>
      <line x1="14" y1="82" x2="86" y2="82"/>
    </g>
    <!-- 日/月圆 -->
    <circle cx="74" cy="26" r="9" fill="none" stroke="${CYAN}" stroke-width="2.4"
            stroke-opacity=".85" filter="url(#glowC)"/>
    <!-- 路线 -->
    <path d="M12 78 L34 56 L52 62 L72 40 L88 44" fill="none" stroke="${CYAN}"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowC)"/>
    <!-- 站点 -->
    <circle cx="12" cy="78" r="5" fill="${BG}" stroke="${CYAN}" stroke-width="3" filter="url(#glowC)"/>
    <circle cx="88" cy="44" r="5" fill="${BG}" stroke="${CYAN}" stroke-width="3" filter="url(#glowC)"/>
    <circle cx="52" cy="62" r="6.5" fill="${MAGENTA}" filter="url(#glowM)"/>
    <circle cx="52" cy="62" r="2.6" fill="#fff"/>
  </g>`;

const defs = `
  <defs>
    <filter id="glowC" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="${CYAN}" flood-opacity=".75"/>
    </filter>
    <filter id="glowM" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.6" flood-color="${MAGENTA}" flood-opacity=".85"/>
    </filter>
  </defs>`;

let inner;
if (variant === 'legacy') {
  inner = `<rect x="1.5" y="1.5" width="97" height="97" rx="19" fill="${BG}"
             stroke="rgba(0,240,255,.35)" stroke-width="1.5"/>` + art('');
} else {
  // 前景层：108dp 画布，安全区中央 66dp → 图形缩到 ~0.62
  inner = art('translate(19 19) scale(0.62)');
}

document.body.innerHTML =
  `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100">${defs}${inner}</svg>`;
</script>
</body>
</html>
